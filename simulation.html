<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Park Nova </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-mark">PN</div>
    <div class="brand-text">
      <h1>Park Nova <span class="tag"></span></h1>
      <p>Live simulation · Cost analysis (PKR)</p>
    </div>
  </div>
  <div class="topbar-actions">
   <!-- SYSTEM STARTING -->
    <div class="duration-picker">
      <span>Park Duration</span>
      <select id="durationSelect">
        <option value="10">10 Sec</option>
        <option value="15" selected>15 Sec</option>
        <option value="20">20 Sec</option>
        <option value="25">25 Sec</option>
      </select>
    </div>
    <button id="btnStart" class="btn btn-accent"> Start Simulation</button>
    <button id="btnSpawn" class="btn btn-ghost"> Generate Car</button>
    <button id="btnReset" class="btn btn-ghost"> Reset State</button>
    <button id="btnClear" class="btn btn-danger-ghost"> Clear Layout</button>
  </div>
</header>
<main class="layout">
  <!-- LEFT: component library -->
  <aside class="panel lib">
    <h2> Components </h2>
    <div id="libList" class="lib-list"></div>
  </aside>
  <!-- CENTER: canvas -->
  <section class="canvas-wrap">
    <div id="canvas" class="canvas"></div>
  </section>
  <!-- RIGHT: cost analysis -->
  <aside class="panel side">
    <div class="card slot-size-card" id="slotSizeCard" style="display:none;">
      <h2> Slot Size</h2>
      <p class="card-sub">Selected slot: <b id="slotSizeName">—</b></p>
      <div class="slot-size-controls">
        <label>Width (px)
          <input type="number" id="slotWidthInput" min="30" max="400" step="2">
        </label>
        <label>Height (px)
          <input type="number" id="slotHeightInput" min="30" max="400" step="2">
        </label>
      </div>
    </div>
    <div class="card status-card">
      <h2> Live Parking Status</h2>
      <p class="card-sub">Live count across your placed slots</p>
      <div class="status-row-grid" id="statusRowGrid"></div>
    </div>
    <div class="card cost-card">
      <h2> Cost &amp; Budget Analysis</h2>
      <p class="card-sub">Estimated setup cost in PKR</p>
      <div class="total-box">
        <span>Total Investment</span>
        <strong id="totalCost">Rs 0</strong>
        <small id="monthlyCost">Monthly maintenance: Rs 0/mo</small>
      </div>
      <div class="stat-grid" id="statGrid"></div>
    </div>
  </aside>
</main>
<script src="script.js"></script>
</body>
</html>
